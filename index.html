*{box-sizing:border-box}html,body,#root{height:100%;margin:0}
body{background:radial-gradient(ellipse at 50% 120%,#0f3a8a 0,transparent 55%),var(--bg);color:var(--text);font-family:"Segoe UI",system-ui,sans-serif}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.stars{position:fixed;inset:0;z-index:-1;background-image:radial-gradient(1.5px 1.5px at 20px 30px,#fff,transparent),radial-gradient(1px 1px at 90px 140px,#9cf,transparent),radial-gradient(1.5px 1.5px at 160px 70px,#fff,transparent);background-size:200px 200px;animation:drift 120s linear infinite;opacity:.7}
@keyframes drift{to{background-position:-800px 400px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
.nav{display:flex;align-items:center;gap:24px;padding:12px 28px;border-bottom:1px solid #1c3a78;background:#06122ecc}
.nav .logo{font-weight:700;font-size:20px;margin-right:auto;display:flex;gap:10px;align-items:center}
.nav .logo b{color:var(--cyan)}.nav a{color:var(--text);cursor:pointer;opacity:.85}.nav a.on{color:var(--cyan);border-bottom:2px solid var(--cyan)}
.nasa{width:38px;height:38px;border-radius:50%;background:#0b3d91;display:grid;place-items:center;font:700 10px serif;border:2px solid #fff3}
.btn{border:1px solid var(--cyan);background:transparent;padding:10px 20px;border-radius:12px}
.btn.blue{background:linear-gradient(#1b8bff,#0a5fd6);border-color:#4aa8ff}
.btn.gold{background:linear-gradient(#ffd84a,#ffb300);color:#1a1200;font-weight:700;border:0;border-radius:999px;padding:12px 28px;box-shadow:0 4px 18px #ffc61a55}
.btn:disabled{opacity:.4;cursor:not-allowed}
.page{max-width:1300px;margin:0 auto;padding:24px}
h1{font-size:40px;margin:8px 0;text-align:center}h1 em{color:var(--cyan);font-style:normal}
.sub{text-align:center;color:var(--mut);margin:0 0 24px}
.card{background:linear-gradient(#0c2150,#081633);border:1.5px solid #1e5fbf;border-radius:18px;padding:18px;box-shadow:0 0 22px #1b8bff33,inset 0 0 20px #0a2a6a55}
.card.sel{border-color:var(--cyan);box-shadow:0 0 28px #27d3ff88}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:24px;max-width:900px;margin:0 auto}
@media(max-width:800px){.grid3,.grid2{grid-template-columns:1fr}}
.hero{display:grid;grid-template-columns:1.1fr 1fr;align-items:center;min-height:70vh;gap:24px}
.hero h2{font-size:64px;line-height:1.02;margin:0 0 18px;border-left:4px solid #1b8bff;padding-left:18px}.hero h2 em{color:#2b9cff;font-style:normal}
.hero p{color:var(--mut);font-size:19px;max-width:520px}
@media(max-width:800px){.hero{grid-template-columns:1fr}.hero h2{font-size:42px}}
.orbit{position:relative;height:420px}.orbit .earth{position:absolute;bottom:-260px;left:0;right:-20%;height:420px;border-radius:50%;background:radial-gradient(circle at 50% 0,#3a8dff,#0b2d7a 55%,#030a1e);box-shadow:0 -10px 60px #1b8bff}
.orbit .sat{position:absolute;top:60px;right:80px;font-size:70px;animation:float 6s ease-in-out infinite}@keyframes float{50%{transform:translateY(-14px) rotate(8deg)}}
.auth{max-width:480px;margin:6vh auto}.tabs{display:flex;margin-bottom:18px}.tabs button{flex:1;padding:12px;border:1px solid #1e5fbf;background:transparent;border-radius:12px 12px 0 0}
.tabs button.on{background:var(--gold);color:#1a1200;font-weight:700;border-color:var(--gold)}
.field{display:flex;align-items:center;gap:10px;border:1.5px solid #1e7fd0;background:#030c20;border-radius:999px;padding:4px 16px;margin:12px 0}
.field input{flex:1;background:transparent;border:0;color:var(--text);padding:12px 0;font-size:16px;outline:0}
.err{color:var(--bad);margin:8px 0;min-height:20px}.or{text-align:center;color:var(--mut);margin:14px 0}
.mcard{display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden}.mcard .art{height:110px;border-radius:12px;display:grid;place-items:center;font-size:54px}
.tag{position:absolute;top:10px;left:10px;background:var(--gold);color:#222;border-radius:8px;padding:2px 10px;font-weight:700;font-size:13px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.bar{height:12px;border-radius:99px;background:#0a2a5c;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#1bb8ff,#27d3ff)}
.side{display:grid;grid-template-columns:260px 1fr;gap:20px}@media(max-width:800px){.side{grid-template-columns:1fr}}
.avatar{width:150px;height:150px;border-radius:24px;background:linear-gradient(#1b8bff,#0b2d7a);display:grid;place-items:center;font-size:80px;margin:0 auto 10px;border:2px solid var(--cyan)}
.menu button{display:block;width:100%;text-align:left;padding:12px 16px;border:0;background:transparent;border-radius:12px;margin:2px 0}.menu button.on{background:linear-gradient(#1b8bff,#0a5fd6)}
.stat{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px;text-align:center}.stat b{display:block;font-size:30px;color:var(--cyan)}
.ok{color:var(--ok)}.lock{color:var(--mut)}
.wiz{max-width:1400px}.steps{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.st{border:1px solid #1e5fbf;border-radius:99px;padding:4px 12px;font-size:13px;color:var(--mut)}.st.on{background:var(--cyan);color:#021;font-weight:700}.st.done{color:var(--ok);border-color:var(--ok)}
.stitle{background:linear-gradient(90deg,#0a4fd0,#0a2a6a);border-radius:999px;padding:10px 24px;display:inline-block;margin:6px 0 14px}
.tool{display:flex;gap:8px;margin-bottom:8px}.tool button{background:#0a1a3a;border:1px solid #1e5fbf;border-radius:10px;padding:6px 12px}
.panel{position:fixed;top:120px;right:24px;width:320px;z-index:20}
.wrow{display:flex;gap:18px;align-items:flex-start}.guide{width:200px;flex-shrink:0}@media(max-width:800px){.wrow{flex-direction:column}.guide{width:auto}}
.face{font-size:48px;text-align:center}.face.big{font-size:110px}.bubble{background:#f4f8ff;color:#0a1a3a;border-radius:18px;padding:12px;font-size:14px;margin-top:8px}
.wgrid{display:grid;grid-template-columns:1.4fr 1fr;gap:14px}.wgrid2{display:grid;grid-template-columns:1.4fr 1fr;gap:14px}.wgrid3{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:14px}.wfull{grid-column:1/-1}
@media(max-width:900px){.wgrid,.wgrid2,.wgrid3{grid-template-columns:1fr}}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}@media(max-width:900px){.grid4{grid-template-columns:repeat(2,1fr)}}
.pick{text-align:center;display:flex;flex-direction:column;gap:4px;cursor:pointer}small{color:var(--mut)}.gold{color:var(--gold)}.bad{color:var(--bad)}
.term{background:none;border:0;border-bottom:1px dashed var(--gold);color:var(--gold);padding:0}
.video{position:relative;height:300px;border-radius:18px;overflow:hidden;border:1.5px solid var(--cyan)}.video .planet{position:absolute;right:-60px;top:20px;width:240px;height:240px;border-radius:50%;transition:transform .5s}
.vship{position:absolute;top:45%;font-size:42px;transform:rotate(45deg);transition:left .5s linear}.vcap{position:absolute;top:12px;left:16px;font-weight:700}
.spec .row{border-bottom:1px solid #1e5fbf44;padding:3px 0}
.simgrid{display:grid;grid-template-columns:220px 1fr 280px;gap:12px}@media(max-width:1000px){.simgrid{grid-template-columns:1fr}}
.simcol{display:flex;flex-direction:column;gap:10px}.simmid{display:flex;flex-direction:column;gap:8px}.simcol h4{margin:0 0 6px}
.scene{width:100%;background:radial-gradient(circle at 50% 100%,#0b2d7a55,#030a1e);border:1.5px solid var(--cyan);border-radius:18px}
.alert{border:2px solid var(--bad);border-radius:14px;padding:8px 14px;background:#3a0a1466}.log div{margin:3px 0;font-size:13px}.instbar{margin-top:12px;flex-wrap:wrap}
.overlay{position:fixed;inset:0;background:#000a;display:grid;place-items:center;z-index:30}.modal{max-width:520px;width:92%}
.hrow{width:100%;background:none;border:1px solid transparent;border-radius:10px;padding:8px;text-align:left}.hrow.on{border-color:var(--cyan);background:#0a2a6a}
.medal{text-align:center}.hex{font-size:44px;width:80px;height:80px;margin:0 auto 4px;display:grid;place-items:center;background:linear-gradient(#ffb020,#a85a00);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.cam{width:100%;border-radius:12px;border:1.5px solid var(--cyan);background:#02061a;display:block;margin-bottom:6px}
.mpgrid{display:grid;grid-template-columns:1fr 320px;gap:14px}@media(max-width:1000px){.mpgrid{grid-template-columns:1fr}}.mpside{display:flex;flex-direction:column;gap:12px}
.chat{height:140px;overflow:auto;background:#030c20;border-radius:10px;padding:8px;font-size:13px;margin-bottom:6px}.chat div{margin-bottom:4px}
.chatin{flex:1;background:#030c20;border:1px solid #1e5fbf;border-radius:10px;color:var(--text);padding:8px}select{background:#030c20;color:var(--text);border:1px solid #1e5fbf;border-radius:10px;padding:8px;width:100%}
.dpad{display:flex;gap:4px;flex-wrap:wrap}.dpad .btn{padding:6px 10px;touch-action:none;user-select:none}
